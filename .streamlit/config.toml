# CareerForge — expressive color psychology
# Navy  → trust, competence, authority (career decisions)
# Teal  → growth, clarity, forward motion
# Gold  → achievement, confidence, call-to-action warmth
# Mist  → calm focus (cool light surfaces, not cream)

[theme]
base = "light"
primaryColor = "#0E7C86"
backgroundColor = "#EAF1F5"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#D9E6EE"
textColor = "#102A3A"
linkColor = "#0E7C86"
borderColor = "#B7CDD9"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.85rem"
font = "'Manrope':https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
headingFont = "'Fraunces':https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 16
baseFontWeight = 500
headingFontSizes = ["2.85rem", "1.85rem", "1.4rem", "1.15rem", "1rem", "0.92rem"]
headingFontWeights = [800, 700, 650, 650, 600, 600]
linkUnderline = false
paddingTop = "1.5rem"
paddingBottom = "2.75rem"
chartCategoricalColors = ["#0E7C86", "#123B56", "#C7923E", "#2F6FED", "#4F7C8A", "#1B3A4B"]

blueColor = "#2F6FED"
greenColor = "#0E7C86"
redColor = "#C44536"
yellowColor = "#C7923E"
orangeColor = "#D08A2E"
violetColor = "#3E5A68"
grayColor = "#5A7585"

dataframeBorderColor = "#B7CDD9"
dataframeHeaderBackgroundColor = "#D9E6EE"

[theme.sidebar]
backgroundColor = "#0A2F45"
secondaryBackgroundColor = "#113B54"
codeBackgroundColor = "#184860"
textColor = "#EAF6F7"
borderColor = "#1C536D"
primaryColor = "#2EC4B6"
linkColor = "#7EE0D5"
